version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    # typescript-eslint does not yet support TypeScript 7; keep 7.x updates
    # out of the grouped tooling PR until that upstream support exists.
    ignore:
      - dependency-name: typescript
        versions:
          - "^7.0.0"
    groups:
      test-and-build-tools:
        patterns:
          - "@types/*"
          - "eslint*"
          - "typescript*"
          - "vitest"
          - "happy-dom"
          - "esbuild"
      runtime:
        patterns:
          - "preact"
          - "react"
          - "react-dom"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: Asia/Shanghai
